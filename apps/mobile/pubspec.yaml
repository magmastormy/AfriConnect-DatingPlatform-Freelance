name: africonnect_mobile
description: Nia mobile client for considered introductions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  clerk_flutter: ^0.0.18-beta
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  go_router: ^18.0.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
