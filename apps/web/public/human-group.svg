<svg viewBox="0 0 520 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A group of verified African professionals connecting">
  <defs>
    <linearGradient id="hgSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c9a8"/>
      <stop offset="1" stop-color="#d99a72"/>
    </linearGradient>
    <linearGradient id="hgSkin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87a52"/>
      <stop offset="1" stop-color="#8f5836"/>
    </linearGradient>
    <linearGradient id="hgGown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1f4d"/>
      <stop offset="1" stop-color="#581845"/>
    </linearGradient>
  </defs>

  <!-- soft glow backdrop -->
  <circle cx="260" cy="220" r="200" fill="#ffffff" opacity="0.06"/>
  <circle cx="260" cy="220" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- Person A (left, seated lean) -->
  <g transform="translate(70,150)">
    <path d="M40 330 C40 250 20 210 60 200 C40 180 60 120 110 130 C150 120 160 170 150 200 C190 215 160 270 160 330 Z" fill="url(#hgGown)"/>
    <circle cx="105" cy="95" r="46" fill="url(#hgSkin)"/>
    <path d="M70 86 C70 56 140 56 140 86 C140 70 120 52 105 52 C90 52 70 70 70 86 Z" fill="#3a2317"/>
    <path d="M64 96 C64 80 146 80 146 96 C150 110 142 120 134 122 C120 108 90 108 76 122 C68 120 60 110 64 96 Z" fill="#2c1810"/>
  </g>

  <!-- Person B (center, standing, slightly forward) -->
  <g transform="translate(205,110)">
    <path d="M55 370 C55 280 30 230 80 220 C55 196 80 128 130 140 C178 128 200 196 178 220 C228 230 205 300 205 370 Z" fill="#900c3f"/>
    <circle cx="128" cy="92" r="52" fill="url(#hgSkin)"/>
    <path d="M86 92 C86 54 170 54 170 92 C170 72 150 50 128 50 C106 50 86 72 86 92 Z" fill="#1c1109"/>
    <path d="M80 96 C80 76 176 76 176 96 C182 114 170 126 160 128 C144 110 112 110 96 128 C86 126 74 114 80 96 Z" fill="#120a05"/>
    <circle cx="112" cy="92" r="4.5" fill="#2c1810"/>
    <circle cx="146" cy="92" r="4.5" fill="#2c1810"/>
    <path d="M118 110 Q128 118 138 110" stroke="#2c1810" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person C (right, seated lean) -->
  <g transform="translate(360,160)">
    <path d="M40 320 C40 246 18 206 60 196 C40 176 64 118 112 130 C158 118 174 178 152 196 C196 206 162 262 162 320 Z" fill="url(#hgGown)"/>
    <circle cx="106" cy="92" r="44" fill="url(#hgSkin2)"/>
    <path d="M72 88 C72 58 140 58 140 88 C140 72 122 54 106 54 C90 54 72 72 72 88 Z" fill="#241008"/>
    <path d="M66 94 C66 78 146 78 146 94 C150 108 142 118 134 120 C120 106 92 106 78 120 C70 118 62 108 66 94 Z" fill="#180a04"/>
  </g>

  <!-- connection spark between B and C -->
  <circle cx="360" cy="250" r="7" fill="#daf7a6"/>
  <circle cx="360" cy="250" r="14" fill="none" stroke="#daf7a6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- verified check badges -->
  <g transform="translate(96,118)">
    <circle r="15" fill="#daf7a6"/>
    <path d="M-7 0 L-2 5 L8 -6" stroke="#581845" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(330,118)">
    <circle r="14" fill="#daf7a6"/>
    <path d="M-6 0 L-2 4 L7 -5" stroke="#581845" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
