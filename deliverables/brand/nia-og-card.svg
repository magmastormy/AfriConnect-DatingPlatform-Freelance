      <stop offset="0" stop-color="#F2D9A7"/>
      <stop offset="0.16" stop-color="#E0B269"/>
      <stop offset="0.38" stop-color="#C08A3E"/>
      <stop offset="0.55" stop-color="#D9A85C"/>
      <stop offset="0.78" stop-color="#8A5726"/>
