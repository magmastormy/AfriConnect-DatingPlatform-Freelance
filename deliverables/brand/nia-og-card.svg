<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Nia — social card</title>
  <desc>Open Graph card: Nia mark, wordmark and tagline on a bronze-black field.</desc>
  <defs>
