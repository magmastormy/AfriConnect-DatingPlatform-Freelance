# Local full-stack for AfriConnect Professionals.
# Brings up the API + Web (Next dev) so you can run the whole product with one
# command. The database is Aiven's FREE PostgreSQL (no Docker, no local Postgres):
# set DATABASE_URL in .env to your Aiven Service URI (with ?sslmode=require) and
# the API connects to it directly.
#
#   cp .env.example .env     # then paste your Aiven Service URI into DATABASE_URL
#   docker compose up --build
#
# Web:  http://localhost:3000   (proxies /<API_MOUNT_PATH>/v1 -> api:4000)
# API:  http://localhost:4000   (mount: /<API_MOUNT_PATH>/v1)
# DB:   Aiven free PostgreSQL (set DATABASE_URL in .env)

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_MOUNT: ${API_MOUNT_PATH:-api}
      NEXT_PUBLIC_API_WS: ws://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_BASE_URL: http://api:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
